AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  parola-inference-pipeline
  
  SAM template for Parola pelagic scoring of validated, dated real environmental inputs.

Parameters:
  ModelBucketName:
    Type: String
    Description: S3 bucket containing the model and output advisories. Pass via --parameter-overrides.
  CopernicusUsername:
    Type: String
    NoEcho: true
    Description: Copernicus Marine Service username. Pass via --parameter-overrides, never commit.
  CopernicusPassword:
    Type: String
    NoEcho: true
    Description: Copernicus Marine Service password. Pass via --parameter-overrides, never commit.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Supabase Postgres connection string (pooler). Pass via --parameter-overrides, never commit.

  EnableDailyPredictions:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to false to pause daily hotspot prediction runs without deleting the schedule.

Resources:
  ParolaInferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      MemorySize: 3008
      Timeout: 300
      EphemeralStorage:
        Size: 2048
      FunctionUrlConfig:
        # IAM auth: invoking the function URL requires SigV4 credentials with
        # permission to call it. Never use AuthType NONE (public internet).
        AuthType: AWS_IAM
      Environment:
        Variables:
          MODEL_BUCKET_NAME: !Ref ModelBucketName
          MODEL_KEY: "models/parola_pelagic_model_v2.txt"
          COPERNICUSMARINE_SERVICE_USERNAME: !Ref CopernicusUsername
          COPERNICUSMARINE_SERVICE_PASSWORD: !Ref CopernicusPassword
          COPERNICUS_USERNAME: !Ref CopernicusUsername
          COPERNICUS_PASSWORD: !Ref CopernicusPassword
          DATABASE_URL: !Ref DatabaseUrl
          PAROLA_ENABLE_DAILY_PREDICTIONS: !Ref EnableDailyPredictions
          PAROLA_ASSET_DIR: "/var/task"
          PAROLA_WORK_DIR: "/tmp"
          OPEN_METEO_MARINE_API_URL: "https://marine-api.open-meteo.com/v1/marine"
          OPEN_METEO_FORECAST_API_URL: "https://api.open-meteo.com/v1/forecast"
          PAGASA_BULLETIN_API_URL: "https://pagasa.chlod.net/api/v1/bulletin/list"
          SAFETY_WIND_THRESHOLD_KNOTS: "20.0"
          SAFETY_WAVE_THRESHOLD_METERS: "3.0"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ModelBucketName
        - S3WritePolicy:
            BucketName: !Ref ModelBucketName
      Events:
        DailyInferenceSchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 21 * * ? *)'
            Name: ParolaDailyInferenceSchedule
            Description: Trigger daily Pelagic + Demersal hotspot pipeline at 05:00 AM Philippine Time (21:00 UTC)
            Enabled: true
        ApiTrigger:
          Type: Api
          Properties:
            Path: /update-workflow
            Method: POST
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

Outputs:
  ParolaInferenceFunctionArn:
    Description: "Parola Inference Lambda Function ARN"
    Value: !GetAtt ParolaInferenceFunction.Arn
  ParolaInferenceFunctionUrl:
    Description: "Function URL to trigger workflow on demand via HTTP"
    Value: !GetAtt ParolaInferenceFunctionUrl.FunctionUrl
  ParolaDataBucketName:
    Description: "S3 Bucket containing the model and output advisories"
    Value: !Ref ModelBucketName
